<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>C Programming Flashcards</title>
  <link rel="stylesheet" href="styleC.css" />
</head>
<body>
  <h1 class="centered-title">C programming</h1>
  <div class="card-stack">
    <div class="card" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <div class="card-front">1. What is Volatile keyword?</div>
        <div class="card-back">"Volatile" tells the compiler that the variable’s value can be changed due to any of the background processes.</div>
      </div>
    </div>
  </div>
  <div class="nav-buttons">
    <div class="button-oval">Prev</div>
    <div class="button-oval">Next</div>
  </div>

  <script>
    function flipCard() {
      document.getElementById("card-inner").classList.toggle("flipped");
    }
  </script>
</body>
</html>
