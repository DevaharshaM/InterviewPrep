<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microcontroller Flashcards</title>
  <link rel="stylesheet" href="styleM.css">
</head>
<body>
  <h1 class="centered-title">Microcontroller peripherals</h1>

  <div class="card-stack" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-inner" id="card-inner">
        <div class="card-front" id="card-front"></div>
        <div class="card-back" id="card-back"></div>
      </div>
    </div>
  </div>
  <div style="height: 3em;"></div>
  <div class="nav-buttons">
    <div class="button-oval" id="prev-btn" onclick="prevCard()">Prev</div>
    <div class="button-oval" id="next-btn" onclick="nextCard()">Next</div>
  </div>

  <script>
    const cards = [
  {
    front: "1. What is Baud Rate in UART?",
    back: `Baud rate is the number of signal changes (symbols) transmitted per second in a communication channel. It defines how fast data is transmitted or received.
      <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Communication/UART%20(Universal%20Asynchronous%20Receiver%20Transmitter).md" target="_blank">More</a>
      </div>`
  },
  {
    front: "2. What are CPOL and CPHA in SPI communication?",
    back: `CPOL (Clock Polarity) and CPHA (Clock Phase) are SPI settings that define how data is sampled and shifted relative to the SPI clock signal.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Communication/SPI%20(Serial%20Peripheral%20Interface).md" target="_blank">More</a>
      </div>`
  },
  {
  front: "3. Why is CAN (Controller Area Network) considered a robust communication protocol?",
  back: `CAN is considered robust primarily because of its differential signaling, along with several other fault-handling and error-checking features that ensure reliable communication even in harsh environments.
    <div class="more-link">
      <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Communication/CAN%20(Controller%20Area%20Network).md" target="_blank">More</a>
     </div>`
},
{
  front: "4. How CAN solves the message collision from different nodes?",
  back: `CAN uses a mechanism called non-destructive bitwise arbitration based on the message identifier (ID). This allows multiple nodes to start transmission simultaneously without data corruption and ensures that the highest priority message wins.
    <div class="more-link">
      <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Communication/CAN%20(Controller%20Area%20Network).md" target="_blank">More</a>
     </div>`
},
{
  front: "5. What is the role of Brown-Out Reset (BOR) in embedded systems?",
  back: `BOR is a safety mechanism that resets the microcontroller when the supply voltage drops below a safe threshold. It prevents unpredictable behavior caused by undervoltage conditions (e.g., data corruption or unstable operation).

<div class="more-link">
  <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Power%20and%20Timing/Power%20Management.md" target="_blank">More</a>
</div>`
},
{
  front: "6. What is an Interrupt Service Routine (ISR) and why should it be short?",
  back: `An Interrupt Service Routine (ISR) is a special function that executes in response to an interrupt signal, and it should be kept short because it temporarily halts the main program flow and, if prolonged, can delay critical tasks, block other interrupts, or cause timing issues in real-time systems.

<div class="more-link">
  <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Interrupts/Interrupts.md" target="_blank">More</a>
</div>`
},
{
  front: "7. What is refresh rate in displays and what happens if it’s too low or too high?",
  back: `Refresh rate is the number of times per second a display updates its content, measured in Hz. Too low a rate (e.g., 30Hz) causes flickering or motion blur. Too high may waste resources or exceed the panel’s specs without visible benefit.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Display/Understanding%20important%20terms.md" target="_blank">More</a>
  </div>`
},
{
  front: "8. What is PWM and why is it used in embedded systems?",
  back: `PWM (Pulse Width Modulation) is a technique used to simulate analog output using digital signals by varying the duty cycle of a square wave. It's commonly used for dimming LEDs, controlling motor speed, and generating audio signals.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Power%20and%20Timing/Timers.md" target="_blank">More</a>
  </div>`
},
{
  front: "9. Why is MIPI-DSI preferred for mobile displays?",
  back: `MIPI-DSI is a high-speed serial display interface ideal for mobile and embedded devices. It supports high resolution and refresh rates while using fewer pins and lower power, which makes it ideal for smartphones and tablets.
  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Display/dsi.md" target="_blank">More</a>
  </div>`
},
{
  front: "10. What is DMA and why is it used in embedded systems?",
  back: `DMA (Direct Memory Access) allows peripherals to transfer data to or from memory without involving the CPU. It improves system efficiency by offloading repetitive data movement tasks, freeing the CPU for other operations.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/DMA/DMA%20(Direct%20Memory%20Access).md" target="_blank">More</a>
  </div>`
},
{
  front: "11. What is the role of a bootloader in embedded systems?",
  back: `A bootloader is a small program that runs immediately after reset and is responsible for loading the main application firmware. It enables features like firmware updates (including OTA), secure boot, and recovery mechanisms.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Bootloader/Bootloader.md" target="_blank">More</a>
  </div>`
},
{
  front: "12. What happens during USB enumeration?",
  back: `During USB enumeration, the host detects a new USB device, queries its descriptors (like vendor ID, product ID), assigns an address, and loads appropriate drivers. It’s the first step in USB communication.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Communication/USB%20(Universal%20Serial%20Bus).md" target="_blank">More</a>
  </div>`
},
{
  front: "13. What is the difference between ADC and DAC?",
  back: `ADC converts analog signals into digital values, while DAC converts digital values into analog voltages or currents. ADC is used for sensors, DAC for controlling analog devices like motors or audio outputs.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/tree/microController/Converters" target="_blank">More</a>
  </div>`
},
{
  front: "14. What is the purpose of the OSI model in networking?",
  back: `The OSI model standardizes network communication by dividing it into 7 layers, from physical transmission to application-level services. It helps design and troubleshoot complex systems by isolating functions.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Networking%20%26%20Connectivity/OSI%20(Open%20Systems%20Interconnection).md" target="_blank">More</a>
  </div>`
},
{
  front: "15. What are common use cases of Wi-Fi in embedded systems?",
  back: `Wi-Fi enables wireless cloud connectivity, OTA firmware updates, web-based configuration pages, and real-time data streaming in embedded systems. Modules like ESP32 are widely used in such applications.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Networking%20%26%20Connectivity/WiFi.md" target="_blank">More</a>
  </div>`
},
{
  front: "16. What is the difference between TCP and UDP?",
  back: `TCP is a reliable, connection-oriented protocol that ensures ordered and complete data delivery. UDP is connectionless and faster, but doesn't guarantee delivery or order, used in applications like streaming or DNS.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Networking%20%26%20Connectivity/TCP.md" target="_blank">More</a>
  </div>`
},
{
  front: "17. Why does Ethernet include both Source and Destination MAC addresses in its frame?",
  back: `Including both Source and Destination MAC addresses ensures proper delivery and traceability. The destination MAC helps switches forward frames to the right device, while the source MAC allows learning tables to track where the frame came from—enabling two-way communication and efficient routing in the LAN.

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Networking%20%26%20Connectivity/Ethernet.md" target="_blank">More</a>
  </div>`
},
{
  front: `18. Match the following protocols to their corresponding OSI layer:<br><br>
<table>
  <thead>
    <tr><th>Protocol</th><th>OSI Layer</th></tr>
  </thead>
  <tbody>
    <tr><td>A) HTTP</td><td>1) Data Link Layer</td></tr>
    <tr><td>B) TCP</td><td>2) Application Layer</td></tr>
    <tr><td>C) IP</td><td>3) Network Layer</td></tr>
    <tr><td>D) Ethernet</td><td>4) Transport Layer</td></tr>
    <tr><td>E) RS-232</td><td>5) Physical Layer</td></tr>
  </tbody>
</table>`,

  back: `A–2, B–4, C–3, D–1, E–5
    <div class="more-link">
      <a href="https://github.com/DevaharshaM/InterviewPrep/blob/microController/Networking%20%26%20Connectivity/OSI%20(Open%20Systems%20Interconnection).md" target="_blank">More</a>
    </div>`
}
];

    let currentCard = 0;

    function updateCard() {
      const front = document.getElementById("card-front");
      const back = document.getElementById("card-back");
      const cardInner = document.getElementById("card-inner");

      front.innerHTML = cards[currentCard].front;
      back.innerHTML = cards[currentCard].back;

      cardInner.classList.remove("flipped");

      document.getElementById("prev-btn").style.visibility = currentCard === 0 ? "hidden" : "visible";
      document.getElementById("next-btn").style.visibility = currentCard === cards.length - 1 ? "hidden" : "visible";
    }

    function flipCard() {
      document.getElementById("card-inner").classList.toggle("flipped");
    }

    function nextCard() {
      if (currentCard < cards.length - 1) {
        currentCard++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentCard > 0) {
        currentCard--;
        updateCard();
      }
    }

    window.onload = updateCard;
  </script>
</body>
</html>
