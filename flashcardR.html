<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OS Flashcards</title>
  <link rel="stylesheet" href="styleR.css">
</head>
<body>
  <h1 class="centered-title">Operating System Concepts</h1>

  <div class="card-stack" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-inner" id="card-inner">
        <div class="card-front" id="card-front"></div>
        <div class="card-back" id="card-back"></div>
      </div>
    </div>
  </div>
  <div style="height: 3em;"></div>
  <div class="nav-buttons">
    <div class="button-oval" id="prev-btn" onclick="prevCard()">Prev</div>
    <div class="button-oval" id="next-btn" onclick="nextCard()">Next</div>
  </div>

  <script>
    const cards = [
  {
    front: "1. What is Kernel?",
    back: `Baud rate is the number of signal changes (symbols) transmitted per second in a communication channel. It defines how fast data is transmitted or received.
      <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Kernel/Kernel%20-%20core%20component%20of%20OS.md" target="_blank">More</a>
      </div>`
  },
  {
    front: "2. A process has 16-bit virtual addresses and uses 4KB pages. How many pages are in the process’s address space?",
    back: `16 pages.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Memory%20Management/Physical%20and%20Virtual%20memory.md" target="_blank">More</a>
      </div>`
  },
  {
    front: "3. What is a page fault, and how is it handled?",
    back: `A page fault occurs when a process accesses a page not currently in RAM. The OS loads the page from disk and may use a page replacement algorithm if RAM is full.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Memory%20Management/Paging%20and%20Segmentation.md" target="_blank">More</a>
      </div>`
  },
  {
    front: "4. What is the difference between a thread and a process?",
    back: `A process has its own memory space; a thread shares memory with other threads in the same process. Threads are lighter and faster to switch.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Process-Task%20Management/Understanding%20important%20terms.md" target="_blank">More</a>
      </div>`
  },
  {
    front: "5. What is context switching and what does the OS save during it?",
    back: `Context switching is the process of storing and restoring a CPU's state to switch between processes or threads. The OS saves registers, PC, and process state in PCB or TCB.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Process-Task%20Management/Context%20Switching.md" target="_blank">More</a>
      </div>`
  },
  {
    front: "6. What is a scheduling algorithm and which one is used in modern systems?",
    back: `Scheduling algorithms determine how processes get CPU time. Modern systems like Linux use the Completely Fair Scheduler (CFS), which balances fairness and efficiency.
    <div class="more-link">
        <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Process-Task%20Management/Scheduling%20Algorithms.md" target="_blank">More</a>
      </div>`
  },
  {
  front: "7. A system has 12 instances of a resource. Process A is holding 5 units, Process B is holding 4 units, and Process C is holding 2 units. If all three processes may need up to 7 units each, is the system in a safe state?",
  back: `
  <div style="font-size: 0.9em; line-height: 1.3;">
    <strong>Not safe.</strong><br>
    <strong>Total resources:</strong> 12<br>
    <strong>Allocated:</strong> 5 (A) + 4 (B) + 2 (C) = 11<br>
    <strong>Available:</strong> 1<br><br>

    <strong>Max additional needs:</strong><br>
    A: 2 more (7 - 5)<br>
    B: 3 more (7 - 4)<br>
    C: 5 more (7 - 2)<br><br>

    <strong>Only 1 is available. No process can finish.</strong>
    <div class="more-link" style="margin-top: 0.5em;">
      <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/Process-Task%20Management/Deadlock%20and%20other%20issues.md" target="_blank">More</a>
    </div>
  </div>`
},
{
  front: "8. What is seek time in a hard disk?",
  back: `Seek time is the time taken by the disk arm to move the read/write head to the correct track where the data resides.
  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/File%20System%20Management/Disk%20Scheduling%20Algorithms.md" target="_blank">More</a>
  </div>`
},
{
  front: "9. A hard disk has 8 platters, 2 surfaces per platter, 1000 tracks per surface, and 64 sectors per track. If each sector holds 512 bytes, what is the total disk size?",
  back: `Disk size = Platters × Surfaces × Tracks × Sectors × Bytes per sector  
  = 8 × 2 × 1000 × 64 × 512  
  = 524,288,000 bytes ≈ 500 MB

  <div class="more-link">
    <a href="https://github.com/DevaharshaM/InterviewPrep/blob/realtimeOS/File%20System%20Management/Disk%20Scheduling%20Algorithms.md" target="_blank">More</a>
  </div>`
}
];

    let currentCard = 0;

    function updateCard() {
      const front = document.getElementById("card-front");
      const back = document.getElementById("card-back");
      const cardInner = document.getElementById("card-inner");

      front.innerHTML = cards[currentCard].front;
      back.innerHTML = cards[currentCard].back;

      cardInner.classList.remove("flipped");

      document.getElementById("prev-btn").style.visibility = currentCard === 0 ? "hidden" : "visible";
      document.getElementById("next-btn").style.visibility = currentCard === cards.length - 1 ? "hidden" : "visible";
    }

    function flipCard() {
      document.getElementById("card-inner").classList.toggle("flipped");
    }

    function nextCard() {
      if (currentCard < cards.length - 1) {
        currentCard++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentCard > 0) {
        currentCard--;
        updateCard();
      }
    }

    window.onload = updateCard;
  </script>
</body>
</html>
